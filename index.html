<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>报价查询工具</title>
<style>
body {
  font-family: Arial, sans-serif;
  padding: 16px;
  background: #f5f7fa;
  color: #1f2937;
  font-size: 14px;
}

.container {
  max-width: 1000px;
  margin: auto;
  background: white;
  padding: 18px;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}

h1 {
  font-size: 22px;
  margin-bottom: 18px;
  color: #1f3c3d;
}

label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #264b4c;
}

select {
  width: 100%;
  height: 40px;
  padding: 0 10px;
  font-size: 14px;
  border: 1px solid #cfd8e3;
  border-radius: 8px;
  background: white;
}

button {
  height: 40px;
  padding: 0 18px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  background: #155e63;
  color: white;
  cursor: pointer;
}

button:hover {
  opacity: 0.92;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.button-row {
  margin-top: 18px;
  display: flex;
  gap: 12px;
}

.error {
  background: #ffe8e8;
  color: #c81e1e;
  padding: 14px;
  margin-top: 18px;
  border-radius: 8px;
  font-size: 14px;
}

.result {
  background: #eef6ff;
  padding: 18px;
  margin-top: 18px;
  border-radius: 10px;
}

.row {
  display: flex;
  justify-content: space-between;
  margin: 8px 0;
  font-size: 14px;
}

.total {
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid #d7dfe8;
  font-size: 16px;
  font-weight: bold;
}

@media (max-width: 900px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .button-row {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

}
</style>
</head>

<body>

<h1>📋 报价查询工具</h1>

<label>RATE TYPE</label>
<select id="rateType"></select>

<label>POL</label>
<select id="pol"></select>

<label>POD</label>
<select id="pod"></select>

<label>CONTAINER TYPE</label>
<select id="containerType"></select>

<button onclick="calculateQuote()">🔍 查询</button>

<div id="output"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_rkgXWvqJu9uRWkyHXLMoGXe1Y1A2pbNvpZ52xU9xr0UE7GsDNSvKXvck8Zk-CRvt7Ys1nClO96tI/pub?output=csv";

let allRows = [];

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];

    if (c === '"' && inQuotes && next === '"') {
      value += '"';
      i++;
    } else if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === "," && !inQuotes) {
      row.push(value.trim());
      value = "";
    } else if ((c === "\n" || c === "\r") && !inQuotes) {
      if (value || row.length) {
        row.push(value.trim());
        rows.push(row);
        row = [];
        value = "";
      }
      if (c === "\r" && next === "\n") i++;
    } else {
      value += c;
    }
  }

  if (value || row.length) {
    row.push(value.trim());
    rows.push(row);
  }

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ? r[i].trim() : "");
    return obj;
  });
}

function unique(arr) {
  return [...new Set(arr.filter(Boolean))];
}

function fillSelect(id, values) {
  const select = document.getElementById(id);
  select.innerHTML = `<option value="">请选择</option>`;
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });
}

function money(v) {
  return Number(String(v || "").replace(/[^0-9.-]/g, "")) || 0;
}

async function loadData() {
  const res = await fetch(CSV_URL + "&t=" + Date.now());
  const text = await res.text();
  allRows = parseCSV(text);

  fillSelect("rateType", unique(allRows.map(r => r["FAK/NAC"])));
  updatePOL();
}

function updatePOL() {
  const rateType = document.getElementById("rateType").value;

  const filtered = allRows.filter(r =>
    !rateType || r["FAK/NAC"] === rateType
  );

  fillSelect("pol", unique(filtered.map(r => r["POL"])));
  updatePOD();
}

function updatePOD() {
  const rateType = document.getElementById("rateType").value;
  const pol = document.getElementById("pol").value;

  const filtered = allRows.filter(r =>
    (!rateType || r["FAK/NAC"] === rateType) &&
    (!pol || r["POL"] === pol)
  );

  fillSelect("pod", unique(filtered.map(r => r["POD"])));
  updateContainerType();
}

function updateContainerType() {
  const rateType = document.getElementById("rateType").value;
  const pol = document.getElementById("pol").value;
  const pod = document.getElementById("pod").value;

  const filtered = allRows.filter(r =>
    (!rateType || r["FAK/NAC"] === rateType) &&
    (!pol || r["POL"] === pol) &&
    (!pod || r["POD"] === pod)
  );

  fillSelect("containerType", unique(filtered.map(r => r["CONTAINER TYPE"])));
}

function calculateQuote() {
  const rateType = document.getElementById("rateType").value;
  const pol = document.getElementById("pol").value;
  const pod = document.getElementById("pod").value;
  const containerType = document.getElementById("containerType").value;

  const matched = allRows.find(r =>
    r["FAK/NAC"] === rateType &&
    r["POL"] === pol &&
    r["POD"] === pod &&
    r["CONTAINER TYPE"] === containerType
  );

  const output = document.getElementById("output");

  if (!matched) {
    output.innerHTML = `
      <div class="error">
        ❌ 未找到匹配数据<br>
        RATE TYPE: ${rateType}<br>
        POL: ${pol}<br>
        POD: ${pod}<br>
        柜型: ${containerType}
      </div>
    `;
    return;
  }

  output.innerHTML = `
    <div class="result">
      <h2>✅ 报价结果</h2>
      <p>RATE TYPE: ${matched["FAK/NAC"]}</p>
      <p>CARRIER: ${matched["CARRIER"]}</p>
      <p>LINE: ${matched["Line"]}</p>
      <p>POL: ${matched["POL"]}</p>
      <p>POD: ${matched["POD"]}</p>
      <p>CONTAINER TYPE: ${matched["CONTAINER TYPE"]}</p>
      <hr>
      <p>OCEAN FREIGHT: USD ${money(matched["OCEAN FREIGHT"]).toFixed(2)}</p>
      <p>FAF: USD ${money(matched["Low Sulphur Fuel surcharge (FAF)"]).toFixed(2)}</p>
      <p>BAU: USD ${money(matched["BAU"]).toFixed(2)}</p>
      <h3>TOTAL COST: ${matched["Total COST(USD)"]}</h3>
    </div>
  `;
}

document.getElementById("rateType").addEventListener("change", updatePOL);
document.getElementById("pol").addEventListener("change", updatePOD);
document.getElementById("pod").addEventListener("change", updateContainerType);

loadData();
</script>

</body>
</html>
