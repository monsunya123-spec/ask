<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>报价查询工具</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px;
  font-family: Inter, Arial, sans-serif;
  background: #f6f8fb;
  color: #172b2c;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px;
  background: #ffffff;
  border: 1px solid #e6ebf1;
  border-radius: 20px;
  box-shadow: 0 8px 24px rgba(15, 35, 55, 0.06);
}

/* ===== TOP BAR ===== */

.topbar {
  display: flex;
  align-items: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid #e6ebf1;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand img {
  height: 38px;
  width: auto;
  object-fit: contain;
}

.brand-text {
  font-size: 20px;
  font-weight: 700;
  color: #123c3d;
  letter-spacing: -0.02em;
}

/* ===== MAIN LAYOUT ===== */

.main-layout {
  display: flex;
  gap: 32px;
  margin-top: 10px;
}

/* ===== LEFT SIDEBAR ===== */

.left-sidebar {
  flex: 0 0 340px;
  min-width: 280px;
}

/* ===== RIGHT CONTENT ===== */

.right-content {
  flex: 1;
  min-width: 0;
}

/* ===== FORM ===== */

label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #416365;
}

select {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  font-size: 14px;
  color: #111827;
  background: #ffffff;
  border: 1px solid #d8e0ea;
  border-radius: 10px;
  outline: none;
  transition: 0.2s;
  margin-bottom: 16px;
}

select:focus {
  border-color: #1e7777;
  box-shadow: 0 0 0 3px rgba(30, 119, 119, 0.12);
}

select option {
  color: #111827;
}

select:disabled {
  background: #f3f6f9;
  color: #8a9ba8;
  cursor: not-allowed;
}

/* ===== BUTTON ===== */

.button-row {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

button {
  flex: 1;
  height: 44px;
  padding: 0 24px;
  font-size: 14px;
  font-weight: 700;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.2s;
  background: #155e63;
  color: white;
}

button:hover {
  transform: translateY(-1px);
  opacity: 0.95;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

button.reset-btn {
  background: #edf3f3;
  color: #155e63;
}

button.reset-btn:hover {
  background: #dce8e8;
}

/* ===== STATUS ===== */

.status {
  margin-bottom: 20px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
}

.status.loading {
  background: #f0f7ff;
  border: 1px solid #cde0f5;
  color: #1a4f8a;
}

.status.success {
  background: #f0faf0;
  border: 1px solid #b8e6b8;
  color: #1a6e1a;
}

.status.error {
  background: #fff1f1;
  border: 1px solid #ffd6d6;
  color: #b91c1c;
}

/* ===== RESULT ===== */

.result-wrapper {
  min-height: 200px;
  background: #f8fafc;
  border: 1px solid #e6ebf1;
  border-radius: 14px;
  padding: 24px;
}

.result-wrapper .empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  color: #8a9ba8;
  font-size: 15px;
}

.error {
  padding: 16px 18px;
  background: #fff1f1;
  border: 1px solid #ffd6d6;
  border-radius: 12px;
  color: #b91c1c;
  font-size: 14px;
}

.result {
  color: #111827;
}

.result h2 {
  margin: 0 0 16px;
  font-size: 20px;
  color: #123c3d;
}

.result .row {
  display: flex;
  padding: 6px 0;
  border-bottom: 1px solid #f0f2f5;
}

.result .row:last-child {
  border-bottom: none;
}

.result .label {
  flex: 0 0 140px;
  font-weight: 600;
  color: #416365;
  font-size: 13px;
}

.result .value {
  flex: 1;
  color: #111827;
  font-size: 13px;
}

.result .divider {
  margin: 12px 0;
  border: none;
  border-top: 2px dashed #d9e4f0;
}

.result .total-row {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 2px solid #1f4e78;
}

.result .total-row .label {
  font-size: 16px;
  color: #123c3d;
}

.result .total-row .value {
  font-size: 18px;
  font-weight: 700;
  color: #155e63;
}

/* ===== MOBILE ===== */

@media (max-width: 900px) {
  body {
    padding: 16px;
  }

  .container {
    padding: 20px;
  }

  .main-layout {
    flex-direction: column;
  }

  .left-sidebar {
    flex: none;
    width: 100%;
    min-width: unset;
  }

  .button-row {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .result .row {
    flex-direction: column;
    padding: 8px 0;
  }

  .result .label {
    flex: none;
    margin-bottom: 2px;
    font-size: 12px;
  }

  .result .value {
    font-size: 14px;
  }
}
</style>
</head>
<body>

<div class="container">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
      <div class="brand-text">Freight Quote Tool</div>
    </div>
  </div>

  <!-- STATUS -->
  <div id="status" class="status loading">⏳ 正在加载数据...</div>

  <!-- MAIN LAYOUT -->
  <div class="main-layout">

    <!-- LEFT SIDEBAR -->
    <div class="left-sidebar">
      <label>VALIDITY</label>
      <select id="validity" disabled></select>

      <label>RATE TYPE</label>
      <select id="rateType" disabled></select>

      <label>POL</label>
      <select id="pol" disabled></select>

      <label>POD</label>
      <select id="pod" disabled></select>

      <label>CONTAINER TYPE</label>
      <select id="containerType" disabled></select>

      <div class="button-row">
        <button id="queryBtn" onclick="calculateQuote()" disabled>🔍 查询</button>
        <button class="reset-btn" onclick="resetAll()">🔄 Reset</button>
      </div>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="right-content">
      <div class="result-wrapper" id="resultWrapper">
        <div class="empty-state">
          📋 请选择查询条件后点击「查询」
        </div>
      </div>
    </div>

  </div>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_rkgXWvqJu9uRWkyHXLMoGXe1Y1A2pbNvpZ52xU9xr0UE7GsDNSvKXvck8Zk-CRvt7Ys1nClO96tI/pub?output=csv";

let allRows = [];
let dataLoaded = false;

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];

    if (c === '"' && inQuotes && next === '"') {
      value += '"';
      i++;
    } else if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === "," && !inQuotes) {
      row.push(value.trim());
      value = "";
    } else if ((c === "\n" || c === "\r") && !inQuotes) {
      if (value || row.length) {
        row.push(value.trim());
        rows.push(row);
        row = [];
        value = "";
      }
      if (c === "\r" && next === "\n") i++;
    } else {
      value += c;
    }
  }

  if (value || row.length) {
    row.push(value.trim());
    rows.push(row);
  }

  if (rows.length === 0) {
    return [];
  }

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ? r[i].trim() : "");
    return obj;
  });
}

function unique(arr) {
  return [...new Set(arr.filter(Boolean))];
}

function fillSelect(id, values, selectedValue = "") {
  const select = document.getElementById(id);

  select.innerHTML = `<option value="">请选择</option>`;

  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });

  select.value = values.includes(selectedValue) ? selectedValue : "";
  select.disabled = values.length === 0;
}

function money(v) {
  return Number(String(v || "").replace(/[^0-9.-]/g, "")) || 0;
}

function getFilters() {
  return {
    validity: document.getElementById("validity").value,
    rateType: document.getElementById("rateType").value,
    pol: document.getElementById("pol").value,
    pod: document.getElementById("pod").value,
    containerType: document.getElementById("containerType").value,
  };
}

function refreshAllSelects() {
  if (!dataLoaded || allRows.length === 0) return;

  const f = getFilters();

  const validityValues = unique(allRows.map(r => r["VALIDITY"]));
  fillSelect("validity", validityValues, f.validity);

  const afterValidity = allRows.filter(r => !f.validity || r["VALIDITY"] === f.validity);
  const rateTypeValues = unique(afterValidity.map(r => r["FAK/NAC"]));
  fillSelect("rateType", rateTypeValues, f.rateType);

  const afterRate = afterValidity.filter(r => !f.rateType || r["FAK/NAC"] === f.rateType);
  const polValues = unique(afterRate.map(r => r["POL"]));
  fillSelect("pol", polValues, f.pol);

  const afterPol = afterRate.filter(r => !f.pol || r["POL"] === f.pol);
  const podValues = unique(afterPol.map(r => r["POD"]));
  fillSelect("pod", podValues, f.pod);

  const afterPod = afterPol.filter(r => !f.pod || r["POD"] === f.pod);
  const containerValues = unique(afterPod.map(r => r["CONTAINER TYPE"]));
  fillSelect("containerType", containerValues, f.containerType);

  document.getElementById("queryBtn").disabled = false;
}

function setupEventListeners() {
  const ids = ["validity", "rateType", "pol", "pod", "containerType"];
  ids.forEach(id => {
    document.getElementById(id).addEventListener("change", () => {
      refreshAllSelects();
    });
  });
}

async function loadData() {
  const status = document.getElementById("status");
  
  try {
    const res = await fetch(CSV_URL + "&t=" + Date.now());
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }
    
    const text = await res.text();
    
    if (!text || text.trim() === "") {
      throw new Error("CSV 文件为空");
    }
    
    allRows = parseCSV(text);
    
    if (allRows.length === 0) {
      throw new Error("没有解析到数据，请检查 CSV 格式");
    }
    
    dataLoaded = true;
    
    status.innerHTML = `✅ 数据加载成功！共 ${allRows.length} 行数据`;
    status.className = "status success";
    
    refreshAllSelects();
    setupEventListeners();
    
  } catch (error) {
    status.innerHTML = `
      ❌ 数据加载失败: ${error.message}<br>
      请检查网络连接或 CSV 链接是否有效
    `;
    status.className = "status error";
    console.error("加载错误:", error);
  }
}

function calculateQuote() {
  if (!dataLoaded) {
    alert("数据还未加载完成，请稍后");
    return;
  }

  const f = getFilters();
  const wrapper = document.getElementById("resultWrapper");
  
  if (!f.validity || !f.rateType || !f.pol || !f.pod || !f.containerType) {
    wrapper.innerHTML = `
      <div class="error">
        ⚠️ 请选择所有筛选条件
      </div>
    `;
    return;
  }

  const matched = allRows.find(r =>
    r["VALIDITY"] === f.validity &&
    r["FAK/NAC"] === f.rateType &&
    r["POL"] === f.pol &&
    r["POD"] === f.pod &&
    r["CONTAINER TYPE"] === f.containerType
  );

  if (!matched) {
    wrapper.innerHTML = `
      <div class="error">
        ❌ 未找到匹配数据，请调整筛选条件
      </div>
    `;
    return;
  }

  const oceanFreight = money(matched["OCEAN FREIGHT"]);
  const faf = money(matched["Low Sulphur Fuel surcharge (FAF)"]);
  const bau = money(matched["BAU"]);
  const peakSeason = matched["Peak Season"] || matched["PEAK SEASON"] || "-";
  const total = money(matched["Total COST(USD)"]);

  wrapper.innerHTML = `
    <div class="result">
      <h2>✅ 报价结果</h2>
      
      <div class="row">
        <div class="label">VALIDITY</div>
        <div class="value">${matched["VALIDITY"] || "-"}</div>
      </div>
      <div class="row">
        <div class="label">RATE TYPE</div>
        <div class="value">${matched["FAK/NAC"] || "-"}</div>
      </div>
      <div class="row">
        <div class="label">CARRIER</div>
        <div class="value">${matched["CARRIER"] || "-"}</div>
      </div>
      <div class="row">
        <div class="label">LINE</div>
        <div class="value">${matched["Line"] || "-"}</div>
      </div>
      <div class="row">
        <div class="label">POL</div>
        <div class="value">${matched["POL"] || "-"}</div>
      </div>
      <div class="row">
        <div class="label">POD</div>
        <div class="value">${matched["POD"] || "-"}</div>
      </div>
      <div class="row">
        <div class="label">CONTAINER TYPE</div>
        <div class="value">${matched["CONTAINER TYPE"] || "-"}</div>
      </div>
      
      <hr class="divider">
      
      <div class="row">
        <div class="label">OCEAN FREIGHT</div>
        <div class="value">USD ${oceanFreight.toFixed(2)}</div>
      </div>
      <div class="row">
        <div class="label">FAF</div>
        <div class="value">USD ${faf.toFixed(2)}</div>
      </div>
      <div class="row">
        <div class="label">BAU</div>
        <div class="value">USD ${bau.toFixed(2)}</div>
      </div>
      <div class="row">
        <div class="label">PEAK SEASON</div>
        <div class="value">${peakSeason}</div>
      </div>
      
      <div class="total-row">
        <div class="row">
          <div class="label">TOTAL COST</div>
          <div class="value">USD ${total.toFixed(2)}</div>
        </div>
      </div>
    </div>
  `;
}

function resetAll() {
  const selectIds = ["validity", "rateType", "pol", "pod", "containerType"];
  selectIds.forEach(id => {
    const select = document.getElementById(id);
    select.value = "";
  });
  
  document.getElementById("resultWrapper").innerHTML = `
    <div class="empty-state">📋 请选择查询条件后点击「查询」</div>
  `;
  
  refreshAllSelects();
}

loadData();
</script>
</body>
</html>
