<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>报价查询工具</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: #f6f8fb;
  color: #172b2c;
}

.container {
  max-width: 980px;
  margin: 32px auto;
  padding: 28px;
  background: #ffffff;
  border: 1px solid #e6ebf1;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(15, 35, 55, 0.06);
}

h1 {
  margin: 0 0 26px;
  font-size: 26px;
  font-weight: 700;
  color: #123c3d;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #416365;
}

select {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  font-size: 14px;
  color: #111827;
  background: #ffffff;
  border: 1px solid #d8e0ea;
  border-radius: 10px;
  outline: none;
}

select:focus {
  border-color: #1e7777;
  box-shadow: 0 0 0 3px rgba(30, 119, 119, 0.12);
}

.button-row {
  display: flex;
  gap: 12px;
  margin-top: 22px;
}

button {
  height: 42px;
  padding: 0 22px;
  font-size: 14px;
  font-weight: 700;
  border: none;
  border-radius: 999px;
  cursor: pointer;
}

button:first-child {
  background: #155e63;
  color: white;
}

button:last-child {
  background: #edf3f3;
  color: #155e63;
}

button:hover {
  transform: translateY(-1px);
  opacity: 0.95;
}

.error {
  margin-top: 22px;
  padding: 16px 18px;
  background: #fff1f1;
  border: 1px solid #ffd6d6;
  border-radius: 12px;
  color: #b91c1c;
  font-size: 14px;
}

.result {
  margin-top: 22px;
  padding: 20px;
  background: #f7fbff;
  border: 1px solid #dceafe;
  border-radius: 14px;
}

.result h2 {
  margin: 0 0 14px;
  font-size: 20px;
  color: #123c3d;
}

.result p {
  margin: 8px 0;
  font-size: 14px;
}

.result h3 {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid #d9e4f0;
  font-size: 18px;
  color: #123c3d;
}

@media (max-width: 850px) {
  .container {
    margin: 16px;
    padding: 20px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .button-row {
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}



  
</style>
</head>

<body>

<div class="topbar">

  <div class="brand">
    <img src="logo.png" alt="Logo">
    <div class="brand-text">
      Freight Quote Tool
    </div>
  </div>

</div>

<label>RATE TYPE</label>
<select id="rateType"></select>

<label>POL</label>
<select id="pol"></select>

<label>POD</label>
<select id="pod"></select>

<label>CONTAINER TYPE</label>
<select id="containerType"></select>

<button onclick="calculateQuote()">🔍 查询</button>

<div id="output"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_rkgXWvqJu9uRWkyHXLMoGXe1Y1A2pbNvpZ52xU9xr0UE7GsDNSvKXvck8Zk-CRvt7Ys1nClO96tI/pub?output=csv";

let allRows = [];

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];

    if (c === '"' && inQuotes && next === '"') {
      value += '"';
      i++;
    } else if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === "," && !inQuotes) {
      row.push(value.trim());
      value = "";
    } else if ((c === "\n" || c === "\r") && !inQuotes) {
      if (value || row.length) {
        row.push(value.trim());
        rows.push(row);
        row = [];
        value = "";
      }
      if (c === "\r" && next === "\n") i++;
    } else {
      value += c;
    }
  }

  if (value || row.length) {
    row.push(value.trim());
    rows.push(row);
  }

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ? r[i].trim() : "");
    return obj;
  });
}

function unique(arr) {
  return [...new Set(arr.filter(Boolean))];
}

function fillSelect(id, values) {
  const select = document.getElementById(id);
  select.innerHTML = `<option value="">请选择</option>`;
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });
}

function money(v) {
  return Number(String(v || "").replace(/[^0-9.-]/g, "")) || 0;
}

async function loadData() {
  const res = await fetch(CSV_URL + "&t=" + Date.now());
  const text = await res.text();
  allRows = parseCSV(text);

  fillSelect("rateType", unique(allRows.map(r => r["FAK/NAC"])));
  updatePOL();
}

function updatePOL() {
  const rateType = document.getElementById("rateType").value;

  const filtered = allRows.filter(r =>
    !rateType || r["FAK/NAC"] === rateType
  );

  fillSelect("pol", unique(filtered.map(r => r["POL"])));
  updatePOD();
}

function updatePOD() {
  const rateType = document.getElementById("rateType").value;
  const pol = document.getElementById("pol").value;

  const filtered = allRows.filter(r =>
    (!rateType || r["FAK/NAC"] === rateType) &&
    (!pol || r["POL"] === pol)
  );

  fillSelect("pod", unique(filtered.map(r => r["POD"])));
  updateContainerType();
}

function updateContainerType() {
  const rateType = document.getElementById("rateType").value;
  const pol = document.getElementById("pol").value;
  const pod = document.getElementById("pod").value;

  const filtered = allRows.filter(r =>
    (!rateType || r["FAK/NAC"] === rateType) &&
    (!pol || r["POL"] === pol) &&
    (!pod || r["POD"] === pod)
  );

  fillSelect("containerType", unique(filtered.map(r => r["CONTAINER TYPE"])));
}

function calculateQuote() {
  const rateType = document.getElementById("rateType").value;
  const pol = document.getElementById("pol").value;
  const pod = document.getElementById("pod").value;
  const containerType = document.getElementById("containerType").value;

  const matched = allRows.find(r =>
    r["FAK/NAC"] === rateType &&
    r["POL"] === pol &&
    r["POD"] === pod &&
    r["CONTAINER TYPE"] === containerType
  );

  const output = document.getElementById("output");

  if (!matched) {
    output.innerHTML = `
      <div class="error">
        ❌ 未找到匹配数据<br>
        RATE TYPE: ${rateType}<br>
        POL: ${pol}<br>
        POD: ${pod}<br>
        柜型: ${containerType}
      </div>
    `;
    return;
  }

  output.innerHTML = `
    <div class="result">
      <h2>✅ 报价结果</h2>
      <p>RATE TYPE: ${matched["FAK/NAC"]}</p>
      <p>CARRIER: ${matched["CARRIER"]}</p>
      <p>LINE: ${matched["Line"]}</p>
      <p>POL: ${matched["POL"]}</p>
      <p>POD: ${matched["POD"]}</p>
      <p>CONTAINER TYPE: ${matched["CONTAINER TYPE"]}</p>
      <hr>
      <p>OCEAN FREIGHT: USD ${money(matched["OCEAN FREIGHT"]).toFixed(2)}</p>
      <p>FAF: USD ${money(matched["Low Sulphur Fuel surcharge (FAF)"]).toFixed(2)}</p>
      <p>BAU: USD ${money(matched["BAU"]).toFixed(2)}</p>
      <h3>TOTAL COST: ${matched["Total COST(USD)"]}</h3>
    </div>
  `;
}

document.getElementById("rateType").addEventListener("change", updatePOL);
document.getElementById("pol").addEventListener("change", updatePOD);
document.getElementById("pod").addEventListener("change", updateContainerType);

loadData();
</script>

</body>
</html>
