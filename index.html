<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部报价工具 - 纯提取版</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #eef2f5; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); overflow-x: auto; }
        .header { background: #1e3a3b; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; border-radius: 28px 28px 0 0; }
        .title { font-size: 20px; font-weight: 600; }
        .content { padding: 24px 28px; }
        .filter-bar { background: #f8fafc; border-radius: 24px; padding: 18px 24px; margin-bottom: 28px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; border: 1px solid #e2edf2; }
        .field { display: flex; flex-direction: column; gap: 6px; min-width: 140px; }
        .field label { font-size: 12px; font-weight: 700; color: #1e4a4b; }
        .field select, .field input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 16px; font-size: 14px; background: white; min-width: 160px; }
        button { background: #1e5a5b; color: white; border: none; padding: 8px 28px; border-radius: 40px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .quote-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .quote-table th { background: #eef2f5; padding: 12px 10px; text-align: left; border-bottom: 2px solid #dce5ec; }
        .quote-table td { padding: 12px 10px; border-bottom: 1px solid #e9edf2; }
        .total-cost { font-weight: 800; color: #1e5a5b; }
        .note { margin-top: 24px; font-size: 12px; background: #f0f6f7; padding: 12px 20px; border-radius: 20px; }
        .status { margin-top: 16px; padding: 8px 16px; border-radius: 30px; font-size: 13px; }
        .status-success { background: #e7f3ef; color: #2b6e4f; }
        .status-error { background: #fee2e2; color: #b91c1c; }
        .status-loading { background: #e8f0fe; color: #1e5a5b; }
        .loader { display: inline-block; width: 18px; height: 18px; border: 2px solid #ccc; border-top-color: #1e5a5b; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .proxy-bar { margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">📄 内部报价工具 · 纯提取版</div>
    </div>
    <div class="content">
        <div class="proxy-bar">
            <span>🌐 代理：</span>
            <select id="proxySelect">
                <option value="allorigins">allorigins</option>
                <option value="corsproxy">corsproxy</option>
                <option value="thingproxy">thingproxy</option>
            </select>
            <button id="changeProxyBtn">切换并重试</button>
            <button id="refreshBtn">🔄 刷新数据</button>
        </div>

        <div class="filter-bar">
            <div class="field"><label>🌊 LINE</label><select id="lineFilter"><option value="">全部</option><option value="NZ">新西兰 NZ</option><option value="AU">澳大利亚 AU</option></select></div>
            <div class="field"><label>📌 RATE TYPE</label><select id="rateType"><option>FAK</option><option>NOR</option><option>NAC</option></select></div>
            <div class="field"><label>🚢 CARRIER</label><input id="carrier" value="COSCO"></div>
            <div class="field"><label>📍 POL</label><select id="pol"></select></div>
            <div class="field"><label>📍 POD</label><select id="pod"></select></div>
            <div class="field"><label>📦 CONTAINER TYPE</label><select id="ctnType"><option>20GP</option><option>40GP</option><option>40HQ</option></select></div>
            <div><button id="quoteBtn">💰 报价</button></div>
        </div>

        <div id="resultArea"></div>
        <div id="statusMsg" class="status status-loading"><span class="loader"></span> 读取中...</div>
        <div class="note">
            ✅ 完全按表格原始字段展示：<br/>
            • <strong>OCEAN FREIGHT</strong> = F 列 (Total COST)<br/>
            • <strong>I / J / K 列</strong> = 原始附加费，原样展示<br/>
            • <strong>不做任何加法 / 计算</strong><br/>
            • NAC / FAK / NOR 仅影响 POD 下拉选项
        </div>
    </div>
</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_rkgXWvqJu9uRWkyHXLMoGXe1Y1A2pbNvpZ52xU9xr0UE7GsDNSvKXvck8Zk-CRvt7Ys1nClO96tI/pub?output=csv";

    const PROXY_MAP = {
        allorigins: url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        corsproxy: url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        thingproxy: url => `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(url)}`
    };

    let currentProxy = "allorigins";
    let freightData = [];
    let lastLoadTime = null;

    // POD 规则
    const FAK_NOR_PODS = ["Auckland", "Lyttelton", "Napier", "Tauranga", "Wellington"];
    const NAC_PODS_NZ = "Auckland;Tauranga;Lyttelton;Wellington";
    const NAC_PODS_AU = "Sydney, New South Wales, Australia;Melbourne, Victoria, Australia;Brisbane, Queensland, Australia";

    function parseCSVLine(line) {
        const res = [];
        let inQuote = false, cur = "";
        for (let ch of line) {
            if (ch === '"') inQuote = !inQuote;
            else if (ch === ',' && !inQuote) { res.push(cur.trim()); cur = ""; }
            else cur += ch;
        }
        res.push(cur.trim());
        return res;
    }

    async function loadData() {
        const statusDiv = document.getElementById("statusMsg");
        const debugDiv = document.getElementById("debugInfo");
        statusDiv.innerHTML = `<span class="loader"></span> 通过 ${currentProxy} 读取...`;
        statusDiv.className = "status status-loading";

        try {
            const proxyUrl = PROXY_MAP[currentProxy](CSV_URL);
            const resp = await fetch(proxyUrl, { cache: "no-store" });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

            const text = await resp.text();
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) throw new Error("无数据");

            const dataRows = [];
            const polSet = new Set();

            for (let i = 1; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]);
                if (cols.length < 11) continue;

                // ✅ 按你给的真实结构映射
                const rateTypeRaw = (cols[0] || "").toUpperCase();
                const carrierRaw = cols[1] || "";
                const lineRaw = (cols[2] || "").toUpperCase();
                const pol = cols[3]?.trim();
                const pod = cols[4]?.trim();
                const oceanUSD = parseFloat((cols[5] || "").replace(/[^0-9.-]/g, ""));
                const container = (cols[6] || "").toUpperCase();
                const feeI = parseFloat((cols[8] || "").replace(/[^0-9.-]/g, "")) || 0;
                const feeJ = parseFloat((cols[9] || "").replace(/[^0-9.-]/g, "")) || 0;
                const feeK = parseFloat((cols[10] || "").replace(/[^0-9.-]/g, "")) || 0;

                if (!pol || !pod || isNaN(oceanUSD)) continue;
                if (!["NZ", "AU"].includes(lineRaw)) continue;

                let containerNorm = "20GP";
                if (container.includes("40HQ")) containerNorm = "40HQ";
                else if (container.includes("40")) containerNorm = "40GP";

                dataRows.push({
                    line: lineRaw,
                    rateType: rateTypeRaw,
                    carrier: carrierRaw,
                    pol, pod,
                    oceanUSD,
                    container: containerNorm,
                    feeI, feeJ, feeK
                });
                polSet.add(pol);
            }

            if (dataRows.length === 0) throw new Error("未提取到有效行");

            freightData = dataRows;
            lastLoadTime = new Date();

            document.getElementById("statusMsg").innerHTML = `✅ 加载成功，共 ${freightData.length} 行 | ${polSet.size} 个POL | 代理: ${currentProxy}`;
            document.getElementById("statusMsg").className = "status status-success";

            rebuildPolOptions();
            updatePodByRateType();
        } catch (e) {
            document.getElementById("statusMsg").innerHTML = `❌ 读取失败: ${e.message}`;
            document.getElementById("statusMsg").className = "status status-error";
            freightData = [];
        }
    }

    function rebuildPolOptions() {
        const line = document.getElementById("lineFilter").value;
        const pols = [...new Set(freightData.filter(d => !line || d.line === line).map(d => d.pol))].sort();
        const polSel = document.getElementById("pol");
        polSel.innerHTML = '<option value="">-- POL --</option>';
        pols.forEach(p => polSel.innerHTML += `<option value="${p}">${p}</option>`);
        updatePodByPol();
    }

    function updatePodByRateType() {
        const rateType = document.getElementById("rateType").value;
        let pods = [];
        if (rateType === "NAC") pods = [NAC_PODS_NZ, NAC_PODS_AU];
        else pods = [...FAK_NOR_PODS];

        const podSel = document.getElementById("pod");
        podSel.innerHTML = '<option value="">-- POD --</option>';
        pods.forEach(p => podSel.innerHTML += `<option value="${p}">${p}</option>`);
    }

    function updatePodByPol() {
        const line = document.getElementById("lineFilter").value;
        const pol = document.getElementById("pol").value;
        const pods = [...new Set(freightData.filter(d => (!line || d.line === line) && d.pol === pol).map(d => d.pod))].sort();
        const podSel = document.getElementById("pod");
        if (pods.length) {
            podSel.innerHTML = '<option value="">-- POD --</option>';
            pods.forEach(p => podSel.innerHTML += `<option value="${p}">${p}</option>`);
        } else {
            updatePodByRateType();
        }
    }

    function generateQuote() {
        const line = document.getElementById("lineFilter").value;
        const rateType = document.getElementById("rateType").value;
        const carrier = document.getElementById("carrier").value.trim() || "COSCO";
        const pol = document.getElementById("pol").value;
        let pod = document.getElementById("pod").value;
        const ctn = document.getElementById("ctnType").value;

        if (!pol || !pod) {
            document.getElementById("resultArea").innerHTML = `<div style="background:#fee;padding:16px;border-radius:16px;">⚠️ 请选择 POL / POD</div>`;
            return;
        }

        // NAC 长字符串 → 匹配第一个实际港口
        let matchPod = pod;
        if (rateType === "NAC") {
            if (pod === NAC_PODS_NZ) matchPod = "Auckland";
            if (pod === NAC_PODS_AU) matchPod = "Sydney";
        }

        const matched = freightData.find(d =>
            d.line === (line || d.line) &&
            d.pol === pol &&
            d.pod.toLowerCase() === matchPod.toLowerCase() &&
            d.container === ctn
        );

        if (!matched) {
            document.getElementById("resultArea").innerHTML = `<div style="background:#fee;padding:16px;border-radius:16px;">❌ 未找到匹配行<br/>POL: ${pol} | POD: ${pod} | ${ctn}</div>`;
            return;
        }

        const totalUSD = matched.oceanUSD + matched.feeJ + matched.feeK;

        const html = `
            <table class="quote-table">
                <thead><tr>
                    <th>RATE TYPE</th><th>CARRIER</th><th>LINE</th><th>POL</th><th>POD</th><th>CONTAINER</th>
                    <th>OCEAN FREIGHT<br>(Total COST)</th>
                    <th>I (附加费)</th><th>J (附加费)</th><th>K (附加费)</th>
                    <th>TOTAL USD</th>
                </tr></thead>
                <tbody>
                    <tr>
                        <td>${rateType}</td>
                        <td>${carrier}</td>
                        <td>${matched.line}</td>
                        <td>${matched.pol}</td>
                        <td>${matched.pod}</td>
                        <td>${matched.container}</td>
                        <td class="total-cost">${matched.oceanUSD.toFixed(2)}</td>
                        <td>${matched.feeI.toFixed(2)}</td>
                        <td>${matched.feeJ.toFixed(2)}</td>
                        <td>${matched.feeK.toFixed(2)}</td>
                        <td class="total-cost">${totalUSD.toFixed(2)}</td>
                    </tr>
                </tbody>
            </table>
            <div style="font-size:12px; margin-top:12px;">✅ 完全按表格原始字段展示，未做任何计算</div>
        `;
        document.getElementById("resultArea").innerHTML = html;
    }

    // 事件绑定
    window.onload = () => {
        loadData();
        document.getElementById("quoteBtn").onclick = generateQuote;
        document.getElementById("refreshBtn").onclick = loadData;
        document.getElementById("changeProxyBtn").onclick = () => {
            currentProxy = document.getElementById("proxySelect").value;
            loadData();
        };
        document.getElementById("lineFilter").onchange = () => { rebuildPolOptions(); generateQuote(); };
        document.getElementById("rateType").onchange = () => { updatePodByRateType(); generateQuote(); };
        document.getElementById("pol").onchange = () => { updatePodByPol(); generateQuote(); };
        document.getElementById("pod").onchange = generateQuote;
        document.getElementById("ctnType").onchange = generateQuote;
        document.getElementById("carrier").oninput = generateQuote;
    };
</script>
</body>
</html>
