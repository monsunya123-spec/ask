<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>内部报价工具 - 多代理版</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; background: #eef2f5; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 32px; box-shadow: 0 12px 28px rgba(0,0,0,0.08); overflow-x: auto; }
        .header { background: #1e3a3b; color: white; padding: 16px 28px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; border-radius: 32px 32px 0 0; }
        .logo-img { height: 48px; width: auto; max-width: 180px; object-fit: contain; background: white; border-radius: 12px; padding: 6px 16px; }
        .title { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .content { padding: 28px 32px; }
        .filter-bar { background: #f8fafc; border-radius: 28px; padding: 22px 28px; margin-bottom: 32px; display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; border: 1px solid #dce9ed; }
        .field { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
        .field label { font-size: 12px; font-weight: 800; color: #1e4a4b; letter-spacing: 0.4px; }
        .field input, .field select { padding: 10px 14px; border: 1px solid #cbdbe6; border-radius: 20px; font-size: 14px; background: white; min-width: 180px; }
        button { background: #1e5a5b; color: white; border: none; padding: 10px 34px; border-radius: 40px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 8px; font-size: 14px; }
        button:hover { background: #0f3b3c; }
        .quote-table { width: 100%; border-collapse: collapse; font-size: 14px; border-radius: 16px; overflow: hidden; }
        .quote-table th { background: #e4edef; padding: 14px 12px; text-align: left; font-weight: 700; border-bottom: 2px solid #cbdadf; }
        .quote-table td { padding: 12px 12px; border-bottom: 1px solid #e2e9ef; }
        .total-cost { font-weight: 800; color: #1e5a5b; font-size: 16px; }
        .note { margin-top: 28px; font-size: 12px; color: #2c6162; background: #eff7f8; padding: 14px 24px; border-radius: 24px; border-left: 5px solid #1e5a5b; }
        .status { font-size: 13px; margin-top: 18px; padding: 10px 18px; border-radius: 30px; }
        .status-success { background: #e7f3ef; color: #2b6e4f; }
        .status-warning { background: #fff3e0; color: #b76e0e; }
        .status-error { background: #fee2e2; color: #b91c1c; }
        .status-loading { background: #e8f0fe; color: #1e5a5b; }
        .loader { border: 2px solid #e2e8f0; border-top: 2px solid #1e5a5b; border-radius: 50%; width: 22px; height: 22px; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .badge { background: #d9f0ec; border-radius: 30px; padding: 4px 12px; font-size: 11px; font-weight: 700; color: #115e59; display: inline-block; }
        .data-info { font-size: 11px; color: #5a7a7b; margin-top: 8px; padding: 8px 12px; background: #f5f9fa; border-radius: 16px; word-break: break-all; max-height: 200px; overflow-y: auto; }
        .refresh-btn { background: #eef2f5; color: #1e5a5b; border: 1px solid #cbd5e1; padding: 6px 16px; font-size: 12px; margin-left: 12px; }
        .refresh-btn:hover { background: #e2e8f0; transform: none; }
        .proxy-selector { margin-bottom: 12px; padding: 8px; background: #f8fafc; border-radius: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .proxy-selector label { font-size: 12px; font-weight: 600; }
        .proxy-selector select { padding: 4px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="ask_logo.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <div class="title">
            📊 内部报价工具 · 多代理版
            <span id="dataBadge" class="badge">⚙️ 支持多代理</span>
        </div>
    </div>
    <div class="content">
        <div class="filter-bar">
            <div class="field"><label>📌 RATE TYPE</label><select id="rateType"><option>FAK</option><option>NOR</option><option>NAC</option></select></div>
            <div class="field"><label>🚢 CARRIER</label><input id="carrier" value="COSCO"></div>
            <div class="field"><label>📍 POL</label><select id="pol"><option value="">-- 选择POL --</option></select></div>
            <div class="field"><label>📍 POD</label><select id="pod"><option value="">-- 请先选择RATE TYPE --</option></select></div>
            <div class="field"><label>📦 CONTAINER TYPE</label><select id="ctnType"><option>20GP</option><option>40GP</option><option>40HQ</option></select></div>
            <div><button id="quoteBtn">💰 生成报价</button></div>
        </div>
        
        <div class="proxy-selector">
            <label>🔄 代理服务器:</label>
            <select id="proxySelect">
                <option value="allorigins">allorigins.win (推荐)</option>
                <option value="corsproxy">corsproxy.io</option>
                <option value="thingproxy">thingproxy (备用)</option>
                <option value="direct">直接访问(仅限已配置CORS)</option>
            </select>
            <button id="changeProxyBtn" style="padding: 4px 16px; margin-top: 0;">切换并重试</button>
        </div>
        
        <div id="resultArea"></div>
        
        <div id="statusMsg" class="status status-loading"><span class="loader"></span> 正在从 Google Sheets 读取实时数据...</div>
        <div id="debugInfo" class="data-info">📋 等待数据加载...</div>
        
        <div class="note">
            🔄 <strong>数据源读取方式</strong><br/>
            ✅ 按列位置读取：<strong>D列 = POL</strong>，<strong>E列 = POD</strong>，<strong>F列 = Total COST(USD)</strong><br/>
            ✅ <strong>OCEAN FREIGHT</strong> = 从您的 Google Sheets 读取 F列 数值<br/>
            ✅ <strong>FAK / NOR</strong> = OCEAN FREIGHT + Low Sulphur Fuel surcharge (FAF)<br/>
            ✅ <strong>NAC</strong> = OCEAN FREIGHT + BAU<br/>
            📌 如果读取失败，请在上方切换不同的代理服务器后点击"切换并重试"
        </div>
        <div style="margin-top: 16px; text-align: right;">
            <button id="refreshDataBtn" class="refresh-btn">🔄 手动刷新数据</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 您最新的 Google Sheets CSV 发布链接
    // ============================================================
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_rkgXWvqJu9uRWkyHXLMoGXe1Y1A2pbNvpZ52xU9xr0UE7GsDNSvKXvck8Zk-CRvt7Ys1nClO96tI/pub?output=csv";
    
    // 代理服务器配置
    const PROXY_CONFIG = {
        allorigins: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        corsproxy: (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        thingproxy: (url) => `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(url)}`,
        direct: (url) => url
    };
    
    // POD 规则定义
    const STANDARD_PODS_NZ_FAK_NOR = ["Auckland", "Lyttelton", "Napier", "Tauranga", "Wellington"];
    const NAC_PODS_NZ = "Auckland;Tauranga;Lyttelton;Wellington";
    const NAC_PODS_AU = "Sydney, New South Wales, Australia;Melbourne, Victoria, Australia;Brisbane, Queensland, Australia";
    
    // 全局运价数据集
    let freightData = [];
    let lastLoadTime = null;
    let currentProxy = "allorigins";
    
    // FAF 和 BUC 月度数据
    const bucFafSource = {
        months: ["Dec","Jan","Feb","Mar","Apr","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
        rows: [
            { tariff: "503/507", type: "BUC", values: [438,417,393,393,438,800,655,0,0,0,0,0,0,0] },
            { tariff: "503/507", type: "FAF", values: [122,101,77,101,146,507,414,0,0,0,0,0,0,0] }
        ]
    };
    
    function getCurrentMonth() {
        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return months[new Date().getMonth()];
    }
    
    function getSurcharge(type, is40ft) {
        const targetRow = bucFafSource.rows.find(r => r.type === type);
        if (!targetRow) return 0;
        const currentMonth = getCurrentMonth();
        const colIndex = bucFafSource.months.findIndex(m => m === currentMonth);
        if (colIndex === -1) return 0;
        let value = targetRow.values[colIndex] || 0;
        if (is40ft) value = value * 2;
        return value;
    }
    
    function parseCSVLine(line) {
        const result = [];
        let inQuote = false;
        let current = '';
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') inQuote = !inQuote;
            else if (ch === ',' && !inQuote) { result.push(current.trim()); current = ''; }
            else current += ch;
        }
        result.push(current.trim());
        return result;
    }
    
    async function fetchWithTimeout(url, timeout = 15000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(url, { 
                cache: "no-store",
                signal: controller.signal,
                mode: "cors"
            });
            clearTimeout(timeoutId);
            return response;
        } catch (err) {
            clearTimeout(timeoutId);
            throw err;
        }
    }
    
    async function loadRealTimeData() {
        const statusDiv = document.getElementById('statusMsg');
        const debugDiv = document.getElementById('debugInfo');
        const badge = document.getElementById('dataBadge');
        
        statusDiv.innerHTML = `<span class="loader"></span> 正在通过 ${currentProxy} 代理读取数据...`;
        statusDiv.className = "status status-loading";
        debugDiv.innerHTML = `🔄 使用代理: ${currentProxy}，请求中...`;
        
        try {
            const proxyUrl = PROXY_CONFIG[currentProxy](CSV_URL);
            console.log("请求URL:", proxyUrl);
            
            const response = await fetchWithTimeout(proxyUrl, 20000);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const csvText = await response.text();
            const lines = csvText.split(/\r?\n/).filter(l => l.trim().length > 0);
            if (lines.length < 2) throw new Error("CSV数据为空");
            
            // 读取表头
            const headers = parseCSVLine(lines[0]);
            console.log("检测到表头:", headers);
            
            // 按列位置读取: D列(索引3)=POL, E列(索引4)=POD, F列(索引5)=Total COST
            const POL_COL_IDX = 3;
            const POD_COL_IDX = 4;
            const TOTAL_COST_COL_IDX = 5;
            
            let newData = [];
            let polSet = new Set();
            let skippedCount = 0;
            
            for (let i = 1; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]);
                
                if (cols.length <= TOTAL_COST_COL_IDX) {
                    skippedCount++;
                    continue;
                }
                
                const polVal = cols[POL_COL_IDX]?.trim();
                const podVal = cols[POD_COL_IDX]?.trim();
                let totalCostVal = parseFloat(cols[TOTAL_COST_COL_IDX]?.trim().replace(/[^0-9.-]/g, ''));
                
                if (!polVal || !podVal || isNaN(totalCostVal) || totalCostVal <= 0) {
                    skippedCount++;
                    continue;
                }
                
                let containerType = "20GP";
                if (cols.length > 2 && cols[2]) {
                    let ct = cols[2].toUpperCase();
                    if (ct.includes("40HQ")) containerType = "40HQ";
                    else if (ct.includes("40GP") || ct.includes("40HC")) containerType = "40GP";
                    else if (ct.includes("20")) containerType = "20GP";
                }
                
                newData.push({ 
                    pol: polVal, 
                    podRaw: podVal,
                    containerType, 
                    oceanFreight: totalCostVal 
                });
                polSet.add(polVal);
            }
            
            if (newData.length === 0) {
                throw new Error(`未读取到有效数据。共检查 ${lines.length-1} 行，跳过 ${skippedCount} 行。请确保 D列=POL, E列=POD, F列有数字。`);
            }
            
            freightData = newData;
            lastLoadTime = new Date();
            
            debugDiv.innerHTML = `✅ 代理 ${currentProxy} 读取成功！<br>📊 共 ${freightData.length} 条运价<br>📍 发现 ${polSet.size} 个POL<br>📅 更新时间: ${lastLoadTime.toLocaleString()}<br>📋 表头预览: ${headers.slice(0, 8).join(' | ')}`;
            statusDiv.innerHTML = `✅ 成功加载！共 ${freightData.length} 条运价 | 代理: ${currentProxy} | 更新时间: ${lastLoadTime.toLocaleString()}`;
            statusDiv.className = "status status-success";
            badge.innerHTML = `✅ ${freightData.length} 条`;
            
            rebuildPolOptions();
            updatePodListByRateType();
            
        } catch (err) {
            console.error("加载失败:", err);
            statusDiv.innerHTML = `⚠️ 代理 ${currentProxy} 读取失败: ${err.message}<br><br>请尝试：<br>1. 在上方切换到其他代理服务器<br>2. 检查网络连接<br>3. 确认表格已发布为公开网页`;
            statusDiv.className = "status status-error";
            debugDiv.innerHTML = `错误: ${err.message}<br>代理: ${currentProxy}<br>数据链接: ${CSV_URL.substring(0, 80)}...<br><br>💡 提示: 请尝试切换到 "corsproxy" 或 "thingproxy" 代理`;
            badge.innerHTML = "⚠️ 读取失败";
            freightData = [];
        }
    }
    
    function rebuildPolOptions() {
        const polSet = new Set();
        freightData.forEach(item => polSet.add(item.pol));
        
        const polSelect = document.getElementById('pol');
        polSelect.innerHTML = '<option value="">-- 选择POL --</option>';
        Array.from(polSet).sort().forEach(pol => {
            polSelect.innerHTML += `<option value="${pol}">${pol}</option>`;
        });
    }
    
    function updatePodListByRateType() {
        const rateType = document.getElementById('rateType').value;
        let podOptions = [];
        
        if (rateType === "NAC") {
            podOptions = [NAC_PODS_NZ, NAC_PODS_AU];
        } else {
            podOptions = [...STANDARD_PODS_NZ_FAK_NOR];
        }
        
        const podSelect = document.getElementById('pod');
        podSelect.innerHTML = '<option value="">-- 选择POD --</option>';
        podOptions.forEach(pod => {
            podSelect.innerHTML += `<option value="${pod}">${pod}</option>`;
        });
    }
    
    function findOceanFreight(rateType, pol, selectedPod, ctnType) {
        if (rateType === "NAC") {
            const match = freightData.find(item => 
                item.pol === pol && 
                item.podRaw === selectedPod && 
                item.containerType === ctnType
            );
            if (match) return match.oceanFreight;
            
            if (ctnType === "40HQ" || ctnType === "40GP") {
                const altMatch = freightData.find(item => 
                    item.pol === pol && 
                    item.podRaw === selectedPod && 
                    (item.containerType === "40GP" || item.containerType === "40HQ")
                );
                if (altMatch) return altMatch.oceanFreight;
            }
            return null;
        } else {
            const match = freightData.find(item => 
                item.pol === pol && 
                item.containerType === ctnType &&
                item.podRaw?.toLowerCase().includes(selectedPod.toLowerCase())
            );
            if (match) return match.oceanFreight;
            
            if (ctnType === "40HQ" || ctnType === "40GP") {
                const altMatch = freightData.find(item => 
                    item.pol === pol && 
                    (item.containerType === "40GP" || item.containerType === "40HQ") &&
                    item.podRaw?.toLowerCase().includes(selectedPod.toLowerCase())
                );
                if (altMatch) return altMatch.oceanFreight;
            }
            return null;
        }
    }
    
    function generateQuote() {
        const rateType = document.getElementById('rateType').value;
        const carrier = document.getElementById('carrier').value.trim() || "COSCO";
        const pol = document.getElementById('pol').value;
        const pod = document.getElementById('pod').value;
        const ctnType = document.getElementById('ctnType').value;
        
        if (!pol || !pod) {
            document.getElementById('resultArea').innerHTML = `<div style="background:#fee;padding:16px;border-radius:16px;color:#b91c1c;">⚠️ 请选择完整的 POL 和 POD</div>`;
            return;
        }
        
        if (!freightData || freightData.length === 0) {
            document.getElementById('resultArea').innerHTML = `<div style="background:#fee;padding:16px;border-radius:16px;color:#b91c1c;">❌ 运价数据未加载，请先等待数据加载成功或切换代理重试。</div>`;
            return;
        }
        
        const is40ft = ctnType.includes("40");
        const oceanFreight = findOceanFreight(rateType, pol, pod, ctnType);
        
        if (oceanFreight === null || oceanFreight === undefined) {
            document.getElementById('resultArea').innerHTML = `<div style="background:#fee;padding:16px;border-radius:16px;color:#b91c1c;">❌ 未找到匹配运价<br/>RATE TYPE: ${rateType} | POL: ${pol} | POD: ${pod} | 柜型: ${ctnType}</div>`;
            return;
        }
        
        let surcharge = 0;
        let surchargeName = "";
        
        if (rateType === "NAC") {
            surcharge = getSurcharge("BUC", is40ft);
            surchargeName = "BAU";
        } else {
            surcharge = getSurcharge("FAF", is40ft);
            surchargeName = "Low Sulphur Fuel surcharge (FAF)";
        }
        
        const totalUSD = oceanFreight + surcharge;
        
        const html = `
            <table class="quote-table">
                <thead>
                    <tr><th>RATE TYPE</th><th>CARRIER</th><th>POL</th><th>POD</th><th>CONTAINER TYPE</th><th>Currency</th>
                    <th>OCEAN FREIGHT<br><span style="font-weight:normal;">(Total COST)</span></th><th>${surchargeName}</th><th>TOTAL USD</th>
                </thead>
                <tbody>
                    <tr><td>${rateType}</td><td>${carrier}</td><td>${pol}</td><td>${pod}</td><td>${ctnType}</td>
                    <td>USD</td><td><strong style="color:#1e5a5b;">${oceanFreight.toFixed(2)}</strong></td>
                    <td>${surcharge.toFixed(2)}</td><td class="total-cost"><strong>${totalUSD.toFixed(2)}</strong></td>
                </tbody>
            </table>
            <div style="font-size:12px; margin-top:16px; padding:10px; background:#f0f6f7; border-radius:12px;">
                📌 OCEAN FREIGHT = 表格中 <strong>F列 (Total COST)</strong> 的实时数值<br>
                📌 ${surchargeName} = 月度动态值 × ${is40ft ? '2 (40尺倍数)' : '1 (20尺倍数)'}<br>
                📅 数据读取时间: ${lastLoadTime ? lastLoadTime.toLocaleString() : '刚刚'}
            </div>
        `;
        
        document.getElementById('resultArea').innerHTML = html;
        document.getElementById('statusMsg').innerHTML = `💰 报价已生成 | OCEAN FREIGHT: ${oceanFreight} USD | TOTAL: ${totalUSD.toFixed(2)} USD`;
        document.getElementById('statusMsg').className = "status status-success";
    }
    
    function changeProxyAndRetry() {
        const newProxy = document.getElementById('proxySelect').value;
        currentProxy = newProxy;
        loadRealTimeData();
    }
    
    window.addEventListener('load', () => {
        loadRealTimeData();
        document.getElementById('quoteBtn').addEventListener('click', generateQuote);
        document.getElementById('refreshDataBtn').addEventListener('click', () => loadRealTimeData());
        document.getElementById('changeProxyBtn').addEventListener('click', () => changeProxyAndRetry());
        document.getElementById('rateType').addEventListener('change', () => { updatePodListByRateType(); generateQuote(); });
        document.getElementById('pol').addEventListener('change', () => generateQuote());
        document.getElementById('pod').addEventListener('change', () => generateQuote());
        document.getElementById('ctnType').addEventListener('change', () => generateQuote());
        document.getElementById('carrier').addEventListener('input', () => generateQuote());
    });
</script>
</body>
</html>
