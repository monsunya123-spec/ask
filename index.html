<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Freight Quote Tool</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f9; padding:30px; }
    .container { max-width:900px; margin:auto; background:white; padding:30px; border-radius:12px; }
    label { display:block; margin-top:16px; font-weight:bold; }
    select, button { width:100%; padding:10px; margin-top:6px; }
    button { margin-top:24px; background:#003366; color:white; border:none; border-radius:8px; cursor:pointer; }
    .result { display:none; margin-top:24px; background:#eef4ff; padding:20px; border-radius:10px; }
    .row { display:flex; justify-content:space-between; margin:10px 0; }
    .total { border-top:1px solid #ccc; padding-top:12px; font-size:20px; font-weight:bold; }
  </style>
</head>

<body>
<div class="container">
  <h1>Freight Quote Tool</h1>

  <label>FAK / NAC</label>
  <select id="rateType"></select>

  <label>POL</label>
  <select id="pol"></select>

  <label>POD</label>
  <select id="pod"></select>

  <label>Container Type</label>
  <select id="containerType"></select>

  <button onclick="calculateQuote()">Calculate Quote</button>

  <div id="result" class="result"></div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_rkgXWvqJu9uRWkyHXLMoGXe1Y1A2pbNvpZ52xU9xr0UE7GsDNSvKXvck8Zk-CRvt7Ys1nClO96tI/pub?output=csv";

let allRows = [];

function parseCSV(text) {
  const rows = [];
  let current = [];
  let value = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      value += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      current.push(value.trim());
      value = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (value || current.length) {
        current.push(value.trim());
        rows.push(current);
        current = [];
        value = "";
      }
      if (char === "\r" && next === "\n") i++;
    } else {
      value += char;
    }
  }

  if (value || current.length) {
    current.push(value.trim());
    rows.push(current);
  }

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ? r[i].trim() : "");
    return obj;
  });
}

function getCol(row, names) {
  for (const name of names) {
    if (row[name] !== undefined) return row[name];
  }
  return "";
}

function unique(arr) {
  return [...new Set(arr.filter(Boolean))];
}

function fillSelect(id, values) {
  const select = document.getElementById(id);
  select.innerHTML = `<option value="">Please select</option>`;

  values.forEach(v => {
    const option = document.createElement("option");
    option.value = v;
    option.textContent = v;
    select.appendChild(option);
  });
}

function num(v) {
  if (!v) return 0;
  return Number(String(v).replace(/[^0-9.-]/g, "")) || 0;
}

async function loadData() {
  const res = await fetch(CSV_URL);
  const text = await res.text();

  allRows = parseCSV(text);

  fillSelect("rateType", unique(allRows.map(r =>
    getCol(r, ["FAK/NAC", "FAK/NAC/NOR", "Rate Type", "TYPE", "Type"])
  )));

  updatePOL();
}

function updatePOL() {
  const rateType = document.getElementById("rateType").value;

  const filtered = allRows.filter(r => {
    const rowRate = getCol(r, ["FAK/NAC", "FAK/NAC/NOR", "Rate Type", "TYPE", "Type"]);
    return !rateType || rowRate === rateType;
  });

  fillSelect("pol", unique(filtered.map(r =>
    getCol(r, ["POL", "Port of Loading"])
  )));

  updatePOD();
}

function updatePOD() {
  const rateType = document.getElementById("rateType").value;
  const pol = document.getElementById("pol").value;

  const filtered = allRows.filter(r => {
    const rowRate = getCol(r, ["FAK/NAC", "FAK/NAC/NOR", "Rate Type", "TYPE", "Type"]);
    const rowPol = getCol(r, ["POL", "Port of Loading"]);

    return (!rateType || rowRate === rateType) &&
           (!pol || rowPol === pol);
  });

  fillSelect("pod", unique(filtered.map(r =>
    getCol(r, ["POD", "Port of Discharge"])
  )));

  updateContainerType();
}

function updateContainerType() {
  const rateType = document.getElementById("rateType").value;
  const pol = document.getElementById("pol").value;
  const pod = document.getElementById("pod").value;

  const filtered = allRows.filter(r => {
    const rowRate = getCol(r, ["FAK/NAC", "FAK/NAC/NOR", "Rate Type", "TYPE", "Type"]);
    const rowPol = getCol(r, ["POL", "Port of Loading"]);
    const rowPod = getCol(r, ["POD", "Port of Discharge"]);

    return (!rateType || rowRate === rateType) &&
           (!pol || rowPol === pol) &&
           (!pod || rowPod === pod);
  });

  fillSelect("containerType", unique(filtered.map(r =>
    getCol(r, ["CONTAINER TYPE", "Container Type"])
  )));
}

function calculateQuote() {
  const rateType = document.getElementById("rateType").value;
  const pol = document.getElementById("pol").value;
  const pod = document.getElementById("pod").value;
  const containerType = document.getElementById("containerType").value;

  const matched = allRows.find(r => {
    const rowRate = getCol(r, ["FAK/NAC", "FAK/NAC/NOR", "Rate Type", "TYPE", "Type"]);
    const rowPol = getCol(r, ["POL", "Port of Loading"]);
    const rowPod = getCol(r, ["POD", "Port of Discharge"]);
    const rowContainer = getCol(r, ["CONTAINER TYPE", "Container Type"]);

    return rowRate === rateType &&
           rowPol === pol &&
           rowPod === pod &&
           rowContainer === containerType;
  });

  const result = document.getElementById("result");

  if (!matched) {
    result.style.display = "block";
    result.innerHTML = "<strong>No matching quote found.</strong>";
    return;
  }

  const ocean = num(getCol(matched, ["OCEAN FREIGHT"]));
  const faf = num(getCol(matched, ["Low Sulphur Fuel surcharge (FAF)", "FAF"]));
  const bau = num(getCol(matched, ["BAU"]));
  const total = num(getCol(matched, ["Total COST(USD)", "TOTAL COST", "Total Cost"]));

  result.style.display = "block";
  result.innerHTML = `
    <h2>Quote Result</h2>

    <div class="row"><span>FAK / NAC</span><strong>${getCol(matched, ["FAK/NAC"])}</strong></div>
    <div class="row"><span>Carrier</span><strong>${getCol(matched, ["CARRIER"])}</strong></div>
    <div class="row"><span>Line</span><strong>${getCol(matched, ["Line"])}</strong></div>
    <div class="row"><span>POL</span><strong>${getCol(matched, ["POL"])}</strong></div>
    <div class="row"><span>POD</span><strong>${getCol(matched, ["POD"])}</strong></div>
    <div class="row"><span>Container Type</span><strong>${getCol(matched, ["CONTAINER TYPE", "Container Type"])}</strong></div>

    <hr>

    <div class="row"><span>OCEAN FREIGHT</span><strong>USD ${ocean.toFixed(2)}</strong></div>
    <div class="row"><span>FAF</span><strong>USD ${faf.toFixed(2)}</strong></div>
    <div class="row"><span>BAU</span><strong>USD ${bau.toFixed(2)}</strong></div>

    <div class="row total"><span>TOTAL COST</span><strong>USD ${total.toFixed(2)}</strong></div>
  `;
}

document.getElementById("rateType").addEventListener("change", updatePOL);
document.getElementById("pol").addEventListener("change", updatePOD);
document.getElementById("pod").addEventListener("change", updateContainerType);

loadData();
</script>
</body>
</html>
