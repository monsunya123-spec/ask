<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>报价查询工具</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px;
  font-family: Inter, Arial, sans-serif;
  background: #f6f8fb;
  color: #172b2c;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px;
  background: #ffffff;
  border: 1px solid #e6ebf1;
  border-radius: 20px;
  box-shadow: 0 8px 24px rgba(15, 35, 55, 0.06);
}

/* ===== TOP BAR ===== */

.topbar {
  display: flex;
  align-items: center;
  margin-bottom: 30px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand img {
  height: 38px;
  width: auto;
  object-fit: contain;
}

.brand-text {
  font-size: 20px;
  font-weight: 700;
  color: #123c3d;
  letter-spacing: -0.02em;
}

/* ===== GRID ===== */

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

/* ===== FORM ===== */

label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #416365;
}

select {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  font-size: 14px;
  color: #111827;
  background: #ffffff;
  border: 1px solid #d8e0ea;
  border-radius: 10px;
  outline: none;
  transition: 0.2s;
}

select:focus {
  border-color: #1e7777;
  box-shadow: 0 0 0 3px rgba(30, 119, 119, 0.12);
}

/* ===== BUTTON ===== */

.button-row {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

button {
  height: 44px;
  padding: 0 24px;
  font-size: 14px;
  font-weight: 700;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.2s;
}

button:first-child {
  background: #155e63;
  color: white;
}

button:last-child {
  background: #edf3f3;
  color: #155e63;
}

button:hover {
  transform: translateY(-1px);
  opacity: 0.95;
}

/* ===== RESULT ===== */

.error {
  margin-top: 24px;
  padding: 16px 18px;
  background: #fff1f1;
  border: 1px solid #ffd6d6;
  border-radius: 12px;
  color: #b91c1c;
  font-size: 14px;
}

.result {
  margin-top: 24px;
  padding: 22px;
  background: #f7fbff;
  border: 1px solid #dceafe;
  border-radius: 14px;
}

.result h2 {
  margin: 0 0 16px;
  font-size: 20px;
  color: #123c3d;
}

.result p {
  margin: 8px 0;
  font-size: 14px;
}

.result h3 {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid #d9e4f0;
  font-size: 18px;
  color: #123c3d;
}

/* ===== MOBILE ===== */

@media (max-width: 850px) {

  body {
    padding: 16px;
  }

  .container {
    padding: 20px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .button-row {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <!-- 修改为 logo.jpg -->
    <img src="logo.jpg" alt="Logo">
    <div class="brand-text">
      Freight Quote Tool
    </div>
  </div>
</div>

<!-- VALIDITY 筛选 -->
<label>VALIDITY</label>
<select id="validity"></select>

<label>RATE TYPE</label>
<select id="rateType"></select>

<label>POL</label>
<select id="pol"></select>

<label>POD</label>
<select id="pod"></select>

<label>CONTAINER TYPE</label>
<select id="containerType"></select>

<button onclick="calculateQuote()">🔍 查询</button>

<div id="output"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_rkgXWvqJu9uRWkyHXLMoGXe1Y1A2pbNvpZ52xU9xr0UE7GsDNSvKXvck8Zk-CRvt7Ys1nClO96tI/pub?output=csv";

let allRows = [];

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];

    if (c === '"' && inQuotes && next === '"') {
      value += '"';
      i++;
    } else if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === "," && !inQuotes) {
      row.push(value.trim());
      value = "";
    } else if ((c === "\n" || c === "\r") && !inQuotes) {
      if (value || row.length) {
        row.push(value.trim());
        rows.push(row);
        row = [];
        value = "";
      }
      if (c === "\r" && next === "\n") i++;
    } else {
      value += c;
    }
  }

  if (value || row.length) {
    row.push(value.trim());
    rows.push(row);
  }

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ? r[i].trim() : "");
    return obj;
  });
}

function unique(arr) {
  return [...new Set(arr.filter(Boolean))];
}

function fillSelect(id, values) {
  const select = document.getElementById(id);
  select.innerHTML = `<option value="">请选择</option>`;
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });
}

function money(v) {
  return Number(String(v || "").replace(/[^0-9.-]/g, "")) || 0;
}

// 获取当前所有筛选条件
function getFilters() {
  return {
    validity: document.getElementById("validity").value,
    rateType: document.getElementById("rateType").value,
    pol: document.getElementById("pol").value,
    pod: document.getElementById("pod").value,
    containerType: document.getElementById("containerType").value,
  };
}

// 根据当前筛选条件过滤数据
function filterRows() {
  const f = getFilters();
  return allRows.filter(r =>
    (!f.validity || r["VALIDITY"] === f.validity) &&
    (!f.rateType || r["FAK/NAC"] === f.rateType) &&
    (!f.pol || r["POL"] === f.pol) &&
    (!f.pod || r["POD"] === f.pod) &&
    (!f.containerType || r["CONTAINER TYPE"] === f.containerType)
  );
}

// 联动刷新所有下拉框
function refreshAllSelects() {
  const f = getFilters();

  // 1. 更新 VALIDITY（基于全部数据）
  const validityValues = unique(allRows.map(r => r["VALIDITY"]));
  fillSelect("validity", validityValues);

  // 2. 根据当前 VALIDITY 过滤后更新 RATE TYPE
  const afterValidity = allRows.filter(r => !f.validity || r["VALIDITY"] === f.validity);
  fillSelect("rateType", unique(afterValidity.map(r => r["FAK/NAC"])));

  // 3. 根据当前 VALIDITY + RATE TYPE 更新 POL
  const afterRate = afterValidity.filter(r => !f.rateType || r["FAK/NAC"] === f.rateType);
  fillSelect("pol", unique(afterRate.map(r => r["POL"])));

  // 4. 根据当前 VALIDITY + RATE TYPE + POL 更新 POD
  const afterPol = afterRate.filter(r => !f.pol || r["POL"] === f.pol);
  fillSelect("pod", unique(afterPol.map(r => r["POD"])));

  // 5. 根据当前 VALIDITY + RATE TYPE + POL + POD 更新 CONTAINER TYPE
  const afterPod = afterPol.filter(r => !f.pod || r["POD"] === f.pod);
  fillSelect("containerType", unique(afterPod.map(r => r["CONTAINER TYPE"])));
}

// 下拉改变时触发联动刷新
function setupEventListeners() {
  const ids = ["validity", "rateType", "pol", "pod", "containerType"];
  ids.forEach(id => {
    document.getElementById(id).addEventListener("change", () => {
      refreshAllSelects();
    });
  });
}

async function loadData() {
  const res = await fetch(CSV_URL + "&t=" + Date.now());
  const text = await res.text();
  allRows = parseCSV(text);

  // 初始化下拉框
  refreshAllSelects();
  setupEventListeners();
}

function calculateQuote() {
  const f = getFilters();

  const matched = allRows.find(r =>
    (!f.validity || r["VALIDITY"] === f.validity) &&
    (!f.rateType || r["FAK/NAC"] === f.rateType) &&
    (!f.pol || r["POL"] === f.pol) &&
    (!f.pod || r["POD"] === f.pod) &&
    (!f.containerType || r["CONTAINER TYPE"] === f.containerType)
  );

  const output = document.getElementById("output");

  if (!matched) {
    output.innerHTML = `
      <div class="error">
        ❌ 未找到匹配数据<br>
        VALIDITY: ${f.validity || "未选择"}<br>
        RATE TYPE: ${f.rateType || "未选择"}<br>
        POL: ${f.pol || "未选择"}<br>
        POD: ${f.pod || "未选择"}<br>
        柜型: ${f.containerType || "未选择"}
      </div>
    `;
    return;
  }

  output.innerHTML = `
    <div class="result">
      <h2>✅ 报价结果</h2>
      <p>VALIDITY: ${matched["VALIDITY"] || "-"}</p>
      <p>RATE TYPE: ${matched["FAK/NAC"]}</p>
      <p>CARRIER: ${matched["CARRIER"]}</p>
      <p>LINE: ${matched["Line"]}</p>
      <p>POL: ${matched["POL"]}</p>
      <p>POD: ${matched["POD"]}</p>
      <p>CONTAINER TYPE: ${matched["CONTAINER TYPE"]}</p>
      <hr>
      <p>OCEAN FREIGHT: USD ${money(matched["OCEAN FREIGHT"]).toFixed(2)}</p>
      <p>FAF: USD ${money(matched["Low Sulphur Fuel surcharge (FAF)"]).toFixed(2)}</p>
      <p>BAU: USD ${money(matched["BAU"]).toFixed(2)}</p>
      <h3>TOTAL COST: ${matched["Total COST(USD)"]}</h3>
    </div>
  `;
}

loadData();
</script>
</body>
</html>
