<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>报价查询工具</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px;
  font-family: Inter, Arial, sans-serif;
  background: #f6f8fb;
  color: #172b2c;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px;
  background: #ffffff;
  border: 1px solid #e6ebf1;
  border-radius: 20px;
  box-shadow: 0 8px 24px rgba(15, 35, 55, 0.06);
}

/* ===== TOP BAR ===== */

.topbar {
  display: flex;
  align-items: center;
  margin-bottom: 30px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand img {
  height: 38px;
  width: auto;
  object-fit: contain;
}

.brand-text {
  font-size: 20px;
  font-weight: 700;
  color: #123c3d;
  letter-spacing: -0.02em;
}

/* ===== FORM ===== */

label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #416365;
}

select {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  font-size: 14px;
  color: #111827;  /* 深色文字 */
  background: #ffffff;
  border: 1px solid #d8e0ea;
  border-radius: 10px;
  outline: none;
  transition: 0.2s;
}

select:focus {
  border-color: #1e7777;
  box-shadow: 0 0 0 3px rgba(30, 119, 119, 0.12);
}

select option {
  color: #111827;  /* 选项文字深色 */
}

select:disabled {
  background: #f3f6f9;
  color: #8a9ba8;
  cursor: not-allowed;
}

/* ===== BUTTON ===== */

button {
  height: 44px;
  padding: 0 24px;
  margin-top: 24px;
  font-size: 14px;
  font-weight: 700;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.2s;
  background: #155e63;
  color: white;
}

button:hover {
  transform: translateY(-1px);
  opacity: 0.95;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ===== RESULT ===== */

.error {
  margin-top: 24px;
  padding: 16px 18px;
  background: #fff1f1;
  border: 1px solid #ffd6d6;
  border-radius: 12px;
  color: #b91c1c;
  font-size: 14px;
}

.success {
  margin-top: 24px;
  padding: 16px 18px;
  background: #f0faf0;
  border: 1px solid #b8e6b8;
  border-radius: 12px;
  color: #1a6e1a;
  font-size: 14px;
}

.result {
  margin-top: 24px;
  padding: 22px;
  background: #f7fbff;
  border: 1px solid #dceafe;
  border-radius: 14px;
  color: #111827;  /* 整体文字深色 */
}

.result h2 {
  margin: 0 0 16px;
  font-size: 20px;
  color: #123c3d;
}

.result p {
  margin: 8px 0;
  font-size: 14px;
  color: #111827;  /* 段落文字深色 */
}

.result h3 {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid #d9e4f0;
  font-size: 18px;
  color: #123c3d;
}

/* ===== LOADING ===== */

.loading {
  margin-top: 20px;
  padding: 16px;
  background: #f0f7ff;
  border: 1px solid #cde0f5;
  border-radius: 12px;
  color: #1a4f8a;
  font-size: 14px;
}

/* ===== MOBILE ===== */

@media (max-width: 850px) {

  body {
    padding: 16px;
  }

  .container {
    padding: 20px;
  }

  button {
    width: 100%;
  }

}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
    <div class="brand-text">
      Freight Quote Tool
    </div>
  </div>
</div>

<!-- 数据加载状态 -->
<div id="status" class="loading">⏳ 正在加载数据...</div>

<label>VALIDITY</label>
<select id="validity" disabled></select>

<label>RATE TYPE</label>
<select id="rateType" disabled></select>

<label>POL</label>
<select id="pol" disabled></select>

<label>POD</label>
<select id="pod" disabled></select>

<label>CONTAINER TYPE</label>
<select id="containerType" disabled></select>

<button id="queryBtn" onclick="calculateQuote()" disabled>🔍 查询</button>

<div id="output"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_rkgXWvqJu9uRWkyHXLMoGXe1Y1A2pbNvpZ52xU9xr0UE7GsDNSvKXvck8Zk-CRvt7Ys1nClO96tI/pub?output=csv";

let allRows = [];
let dataLoaded = false;

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];

    if (c === '"' && inQuotes && next === '"') {
      value += '"';
      i++;
    } else if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === "," && !inQuotes) {
      row.push(value.trim());
      value = "";
    } else if ((c === "\n" || c === "\r") && !inQuotes) {
      if (value || row.length) {
        row.push(value.trim());
        rows.push(row);
        row = [];
        value = "";
      }
      if (c === "\r" && next === "\n") i++;
    } else {
      value += c;
    }
  }

  if (value || row.length) {
    row.push(value.trim());
    rows.push(row);
  }

  if (rows.length === 0) {
    return [];
  }

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ? r[i].trim() : "");
    return obj;
  });
}

function unique(arr) {
  return [...new Set(arr.filter(Boolean))];
}

function fillSelect(id, values, selectedValue = "") {
  const select = document.getElementById(id);

  select.innerHTML = `<option value="">请选择</option>`;

  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });

  // 如果原选择仍然存在，就恢复显示
  select.value = values.includes(selectedValue)
    ? selectedValue
    : "";

  select.disabled = values.length === 0;
}

function money(v) {
  return Number(String(v || "").replace(/[^0-9.-]/g, "")) || 0;
}

function getFilters() {
  return {
    validity: document.getElementById("validity").value,
    rateType: document.getElementById("rateType").value,
    pol: document.getElementById("pol").value,
    pod: document.getElementById("pod").value,
    containerType: document.getElementById("containerType").value,
  };
}

function refreshAllSelects() {
  if (!dataLoaded || allRows.length === 0) return;

  const f = getFilters();

  const validityValues = unique(
    allRows.map(r => r["VALIDITY"])
  );
  fillSelect("validity", validityValues, f.validity);

  const afterValidity = allRows.filter(r =>
    !f.validity || r["VALIDITY"] === f.validity
  );
  const rateTypeValues = unique(
    afterValidity.map(r => r["FAK/NAC"])
  );
  fillSelect("rateType", rateTypeValues, f.rateType);

  const afterRate = afterValidity.filter(r =>
    !f.rateType || r["FAK/NAC"] === f.rateType
  );
  const polValues = unique(
    afterRate.map(r => r["POL"])
  );
  fillSelect("pol", polValues, f.pol);

  const afterPol = afterRate.filter(r =>
    !f.pol || r["POL"] === f.pol
  );
  const podValues = unique(
    afterPol.map(r => r["POD"])
  );
  fillSelect("pod", podValues, f.pod);

  const afterPod = afterPol.filter(r =>
    !f.pod || r["POD"] === f.pod
  );
  const containerValues = unique(
    afterPod.map(r => r["CONTAINER TYPE"])
  );
  fillSelect(
    "containerType",
    containerValues,
    f.containerType
  );

  document.getElementById("queryBtn").disabled = false;
}

function setupEventListeners() {
  const ids = ["validity", "rateType", "pol", "pod", "containerType"];
  ids.forEach(id => {
    document.getElementById(id).addEventListener("change", () => {
      refreshAllSelects();
    });
  });
}

async function loadData() {
  const status = document.getElementById("status");
  
  try {
    const res = await fetch(CSV_URL + "&t=" + Date.now());
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }
    
    const text = await res.text();
    
    if (!text || text.trim() === "") {
      throw new Error("CSV 文件为空");
    }
    
    allRows = parseCSV(text);
    
    if (allRows.length === 0) {
      throw new Error("没有解析到数据，请检查 CSV 格式");
    }
    
    dataLoaded = true;
    
    // 只显示简单成功信息，不显示详细数据
    status.innerHTML = `✅ 数据加载成功！共 ${allRows.length} 行数据`;
    status.className = "success";
    
    refreshAllSelects();
    setupEventListeners();
    
  } catch (error) {
    status.innerHTML = `
      ❌ 数据加载失败: ${error.message}<br>
      请检查:<br>
      1. 网络连接是否正常<br>
      2. Google Sheets 是否公开访问<br>
      3. CSV 链接是否正确
    `;
    status.className = "error";
    console.error("加载错误:", error);
  }
}

function calculateQuote() {
  if (!dataLoaded) {
    alert("数据还未加载完成，请稍后");
    return;
  }

  const f = getFilters();
  
  if (!f.validity || !f.rateType || !f.pol || !f.pod || !f.containerType) {
    document.getElementById("output").innerHTML = `
      <div class="error">
        ⚠️ 请选择所有筛选条件
      </div>
    `;
    return;
  }

  const matched = allRows.find(r =>
    r["VALIDITY"] === f.validity &&
    r["FAK/NAC"] === f.rateType &&
    r["POL"] === f.pol &&
    r["POD"] === f.pod &&
    r["CONTAINER TYPE"] === f.containerType
  );

  const output = document.getElementById("output");

  if (!matched) {
    output.innerHTML = `
      <div class="error">
        ❌ 未找到匹配数据
      </div>
    `;
    return;
  }

  output.innerHTML = `
    <div class="result">
      <h2>✅ 报价结果</h2>
      <p>VALIDITY: ${matched["VALIDITY"] || "-"}</p>
      <p>RATE TYPE: ${matched["FAK/NAC"]}</p>
      <p>CARRIER: ${matched["CARRIER"] || "-"}</p>
      <p>LINE: ${matched["Line"] || "-"}</p>
      <p>POL: ${matched["POL"]}</p>
      <p>POD: ${matched["POD"]}</p>
      <p>CONTAINER TYPE: ${matched["CONTAINER TYPE"]}</p>
      <hr>
      <p>OCEAN FREIGHT: USD ${money(matched["OCEAN FREIGHT"]).toFixed(2)}</p>
      <p>FAF: USD ${money(matched["Low Sulphur Fuel surcharge (FAF)"]).toFixed(2)}</p>
      <p>BAU: USD ${money(matched["BAU"]).toFixed(2)}</p>
      <h3>TOTAL COST: ${matched["Total COST(USD)"]}</h3>
    </div>
  `;
}

loadData();
</script>
</body>
</html>
